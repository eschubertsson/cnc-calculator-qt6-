name: Build Windows EXE

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.0'
          arch: 'win64_mingw'

      - name: Configure CMake
        shell: bash
        run: |
          # Vi lägger till den inbyggda MinGW i PATH manuellt
          export PATH="/c/ProgramData/chocolatey/bin:/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin:$PATH"
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        shell: bash
        run: |
          export PATH="/c/ProgramData/chocolatey/bin:/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin:$PATH"
          cmake --build build --config Release

      - name: Package (windeployqt)
        shell: pwsh
        run: |
          # Hitta windeployqt (det installeras av Qt-action) och kör det
          $qtPath = "${{ env.Qt6_DIR }}/bin/windeployqt.exe"
          & $qtPath build/SponfortynningKalkulator.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SponfortynningKalkulator-Windows
          path: build/
