name: Build Windows EXE

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.0'
          arch: 'win64_mingw' # Vi använder MinGW 64-bit

      - name: Set up MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Configure CMake
        run: |
          cmake -S . -B build `
            -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_COMPILER=g++

      - name: Build Project
        run: cmake --build build --config Release

      - name: Package (windeployqt)
        run: |
          # Vi kör windeployqt för att få med alla bibliotek (.dll)
          windeployqt build/SponfortynningKalkulator.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SponfortynningKalkulator-Windows
          path: build/
